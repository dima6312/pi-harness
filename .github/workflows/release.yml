# Releases and publishes in one run. Publishing on the `release` event would not fire, because
# GitHub does not trigger workflows from events created with the default GITHUB_TOKEN.
#
# Every package ships at one version, the way pi does. release-please has one component, the
# repository root, and bumps each package.json through `extra-files`. Merging its release PR tags
# `v<version>` and writes one GitHub release from CHANGELOG.md; the same run then verifies and
# publishes every package to npm.
#
# Publishing is npm trusted publishing over OIDC, so there is no NPM_TOKEN secret. Each package
# needs its own trusted publisher pointing at this workflow: `bun run trust`, run locally.
name: Release

on:
  push:
    branches: [main]
  # Publishes whatever version is on main and not on npm yet, like after a publish that failed.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4

  # release-please bumps every package.json but can't run bun, so bun.lock keeps the old versions
  # of the workspace packages, and `bun pm pack` writes the dependency version from the lockfile.
  # This commits the refreshed lockfile onto the release PR's branch. A push made with GITHUB_TOKEN
  # triggers no workflow, and release-please rewrites the branch on its next run, so this runs again.
  # The docs pictures show the harness version too, so the same commit redraws them; otherwise
  # `docs:check` fails on the release commit and nothing gets published.
  lockfile:
    needs: release
    if: ${{ needs.release.outputs.pr != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release.outputs.pr).headBranchName }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      # `bun run docs` draws with rsvg-convert and the font CONTRIBUTING.md names.
      - name: Install the renderer and the font
        run: |
          sudo apt-get update -q && sudo apt-get install -yq librsvg2-bin
          mkdir -p ~/.local/share/fonts
          curl -fsSL https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.tar.xz \
            | tar -xJ -C ~/.local/share/fonts
          fc-cache -f

      - run: bun run docs

      - name: Commit bun.lock and the pictures
        run: |
          git add bun.lock 'packages/*/assets/*.png' '*.md'
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh bun.lock and the docs pictures"
          git push

  verify:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # One retry, like `CI`: Bun has flaked in the runner spawning the shell in the bash timer
      # tests (EINVAL from epoll_ctl). A second failure is real, and the release stops.
      - run: |
          if bun run verify; then exit 0; fi
          echo "::warning::verify failed, retrying once"
          bun run verify

      # Packs every package, installs the tarballs outside the repository and loads them, so a
      # missing file or an unresolved workspace dependency fails before anything is published.
      - run: bun run smoke

  publish:
    needs: [release, verify]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing wants npm >= 11.5.1, which the runner image may predate.
      - run: npm install -g npm@^11.5.1

      # Publishes in dependency order and skips versions that are already on npm, so a run that
      # died halfway can be started again.
      - run: bun scripts/publish.ts
